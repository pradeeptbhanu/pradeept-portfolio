name: Validate Astro migration

on:
  push:
    branches: ["astro-migration"]
  pull_request:
    branches: ["astro-migration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Astro type check
        run: npm run check
      - name: Astro production build
        run: npm run build
