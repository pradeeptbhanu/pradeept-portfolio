name: Clean portfolio HTML and JS

on:
  push:
    branches: [dev-chatgpt]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.head_commit.message != 'chore: move portfolio content into HTML'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-chatgpt
          fetch-depth: 0

      - name: Clean HTML and JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  <link rel="stylesheet" href="./styles.css" />', '  <link rel="stylesheet" href="./styles.css" />\n  <link rel="stylesheet" href="./mobile-nav-fix.css" />')
          s = s.replace('      <!-- TODO: Add link to home -->\n', '')
          s = s.replace('''      <nav aria-label="Primary navigation">\n        <ul class="nav-links">''', '''      <nav aria-label="Primary navigation">\n        <button class="mobile-nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">\n          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">\n            <path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path>\n          </svg>\n        </button>\n        <ul class="nav-links" id="primary-navigation">''')
          s = s.replace('<li><a href="./services.html">Services</a></li>', '<li><a href="#services">Services</a></li>')
          s = s.replace('<h2 class="section-title reveal">Executive Summary</h2>', '<h2 class="section-title reveal">About Me</h2>')
          s = s.replace('''Strategic technical leader adept at building scalable backend systems, optimizing\n          complex database structures, and leveraging cutting-edge AI tools to streamline design-to-code workflows.''', '''I’m a senior web developer with 10+ years of experience building, fixing and maintaining production websites and web applications.''')
          s = s.replace('''Architecting enterprise web applications, e-commerce storefronts, custom Laravel engines, and\n                  multi-site WordPress platforms''', '''Building and supporting production web applications, e-commerce storefronts, custom Laravel systems, and\n                  multi-site WordPress platforms''')
          s = s.replace('''Currently serving as Development Team Lead at AuroInfo\n              LLC. Directing cross-functional teams in delivering enterprise-grade web applications while enforcing\n              strict code standards, performance optimization, and seamless client onboarding.''', '''Currently serving as Development Team Lead at AuroInfo\n              LLC. I lead development work across Laravel, PHP, WordPress and e-commerce projects, with a focus on\n              clean implementation, performance and reliable delivery.''')
          s = re.sub(r'\s*<li><strong>AI-Accelerated Engineering Workflows</strong>.*?</li>', '', s, count=1, flags=re.S)
          s = s.replace('<span class="trust-number">20+ Projects</span>', '<span class="trust-number">20+ Production Projects</span>', 1)
          s = s.replace('''Specialized technical services tailored for businesses and agencies looking for\n          reliable development, performance optimization, custom features, and ongoing maintenance.''', '''Specialized technical services for businesses and agencies that need reliable development, performance optimization, custom features, or ongoing maintenance.''')

          marker = '    <!-- Core Competencies & Technical Skills -->'
          additions = '''    <!-- Additional Freelance Services -->\n    <section id="additional-services">\n      <div class="container">\n        <div class="services-grid">\n          <article class="panel service-card reveal">\n            <div class="service-header"><div class="service-icon" aria-hidden="true">🔗</div><h3>API & Third-Party Integrations</h3></div>\n            <p class="service-desc">Connect your website or application with external services, APIs and business systems.</p>\n            <div class="service-typical"><div class="service-typical-label">Typical Work</div><ul class="service-work-tags"><li>REST APIs</li><li>Webhooks</li><li>Payment integrations</li><li>Data synchronization</li><li>Third-party services</li></ul></div>\n          </article>\n          <article class="panel service-card reveal">\n            <div class="service-header"><div class="service-icon" aria-hidden="true">🛒</div><h3>E-commerce Development</h3></div>\n            <p class="service-desc">Custom development and technical support for WooCommerce and Shopify stores.</p>\n            <div class="service-typical"><div class="service-typical-label">Typical Work</div><ul class="service-work-tags"><li>WooCommerce</li><li>Shopify</li><li>Custom functionality</li><li>Store integrations</li><li>Performance improvements</li></ul></div>\n          </article>\n        </div>\n      </div>\n    </section>\n\n    <!-- What I Can Help With -->\n    <section id="what-i-can-help">\n      <div class="container">\n        <div class="kicker reveal">Practical Help</div>\n        <h2 class="section-title reveal">What I Can Help You With</h2>\n        <p class="section-copy reveal">Already have a website or application? Or starting something new? I can help with the technical work behind both.</p>\n        <div class="services-grid">\n          <article class="panel service-card reveal"><div class="service-header"><div class="service-icon" aria-hidden="true">🔧</div><h3>Already Have a Website?</h3></div><ul class="service-work-tags"><li>Fix bugs</li><li>Add features</li><li>Improve performance</li><li>Update PHP or WordPress</li><li>Integrate APIs</li><li>Ongoing maintenance</li></ul></article>\n          <article class="panel service-card reveal"><div class="service-header"><div class="service-icon" aria-hidden="true">🚀</div><h3>Starting Something New?</h3></div><ul class="service-work-tags"><li>Laravel applications</li><li>Business websites</li><li>WordPress websites</li><li>E-commerce</li><li>Custom backend systems</li><li>Third-party integrations</li></ul></article>\n        </div>\n      </div>\n    </section>\n\n'''
          if 'id="what-i-can-help"' not in s:
              s = s.replace(marker, additions + marker, 1)

          s = s.replace('''<h3 style="font-size: 1.25rem; line-height: 1.45; color: #ffffff; margin-bottom: 0.5rem;">Based in\n              Bhubaneswar, India · Available for remote projects</h3>''', '''<h3 style="font-size: 1.25rem; line-height: 1.45; color: #ffffff; margin-bottom: 0.5rem;">Bhubaneswar, India · Available Worldwide · Remote</h3>''')
          s = s.replace('''<h2 class="section-title reveal">Have a project in mind?</h2>\n        <p class="section-copy reveal">Tell me what you're trying to build, fix or improve.</p>''', '''<h2 class="section-title reveal">Have a website or application that needs help?</h2>\n        <p class="section-copy reveal">Whether you’re starting something new, fixing an existing system, or looking for ongoing technical support, tell me what you need.</p>''')

          p.write_text(s, encoding='utf-8')

          Path('main.js').write_text(r'''// Intersection Observer for scroll animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1 });

document.querySelectorAll('.reveal').forEach((el, i) => {
  if (i < 2) return;
  observer.observe(el);
});

// Mobile navigation behavior
const mobileNavToggle = document.querySelector('.mobile-nav-toggle');
const navLinks = document.querySelector('.nav-links');

if (mobileNavToggle && navLinks) {
  const closeMobileNav = () => {
    navLinks.classList.remove('is-open');
    mobileNavToggle.setAttribute('aria-expanded', 'false');
    mobileNavToggle.setAttribute('aria-label', 'Open navigation menu');
  };

  mobileNavToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('is-open');
    mobileNavToggle.setAttribute('aria-expanded', String(isOpen));
    mobileNavToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
  });

  navLinks.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileNav));
  document.addEventListener('click', (event) => {
    if (!navLinks.contains(event.target) && !mobileNavToggle.contains(event.target)) closeMobileNav();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMobileNav();
  });
}

// Project Filtering & Live Search Logic
const searchInput = document.getElementById('projectSearch');
const filterBtns = document.querySelectorAll('.filter-btn');
const projectCards = document.querySelectorAll('.project-card');
const projectCounter = document.getElementById('projectCounter');

let currentCategory = 'featured';
let currentSearchTerm = '';

function filterProjects() {
  let visibleCount = 0;
  projectCards.forEach((card) => {
    const categories = card.getAttribute('data-category') || '';
    const cardText = card.textContent.toLowerCase();
    const matchesCategory = currentCategory === 'all' || categories.includes(currentCategory);
    const matchesSearch = cardText.includes(currentSearchTerm);
    if (matchesCategory && matchesSearch) { card.classList.remove('hidden'); visibleCount++; }
    else card.classList.add('hidden');
  });
  if (projectCounter) projectCounter.textContent = `Showing ${visibleCount} of ${projectCards.length} projects`;
}

if (projectCards.length > 0) filterProjects();
filterBtns.forEach((btn) => btn.addEventListener('click', () => {
  filterBtns.forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = btn.getAttribute('data-category');
  filterProjects();
}));
if (searchInput) searchInput.addEventListener('input', (e) => {
  currentSearchTerm = e.target.value.toLowerCase().trim();
  filterProjects();
});

// Web3Forms Form Submission Handler
const form = document.getElementById('form');
if (form) {
  const submitBtn = form.querySelector('button[type="submit"]');
  const formStatus = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const originalText = submitBtn.innerHTML;
    submitBtn.textContent = 'Sending Inquiry...';
    submitBtn.disabled = true;
    if (formStatus) formStatus.style.display = 'none';
    try {
      const response = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
      const data = await response.json();
      if (response.ok && data.success) {
        if (formStatus) {
          formStatus.style.display = 'block';
          formStatus.style.background = 'rgba(102, 210, 143, 0.15)';
          formStatus.style.border = '1px solid rgba(102, 210, 143, 0.35)';
          formStatus.style.color = '#66d28f';
          formStatus.innerHTML = '✓ Thank you! Your project inquiry has been sent successfully. I will get back to you shortly.';
        }
        form.reset();
      } else if (formStatus) {
        formStatus.style.display = 'block';
        formStatus.style.background = 'rgba(255, 107, 107, 0.15)';
        formStatus.style.border = '1px solid rgba(255, 107, 107, 0.35)';
        formStatus.style.color = '#ff6b6b';
        formStatus.innerHTML = '⚠️ Error: ' + (data.message || 'Unable to send message.');
      }
    } catch (error) {
      if (formStatus) {
        formStatus.style.display = 'block';
        formStatus.style.background = 'rgba(255, 107, 107, 0.15)';
        formStatus.style.border = '1px solid rgba(255, 107, 107, 0.35)';
        formStatus.style.color = '#ff6b6b';
        formStatus.innerHTML = '⚠️ Something went wrong. Please check your network connection and try again.';
      }
    } finally {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
    }
  });
}
''', encoding='utf-8')
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html main.js
          git commit -m 'chore: move portfolio content into HTML'
          git push origin dev-chatgpt
