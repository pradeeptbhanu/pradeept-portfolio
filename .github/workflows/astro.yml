name: Deploy Astro portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      # Keep the existing portfolio CSS/JS and branding assets available to the migrated pages.
      - name: Copy legacy static assets
        run: |
          cp styles.css dist/styles.css
          cp main.js dist/main.js
          cp mobile-nav-fix.css dist/mobile-nav-fix.css
          cp favicon.svg dist/favicon.svg
          cp favicon.png dist/favicon.png
          cp CNAME dist/CNAME
          mkdir -p dist/sudoku-brain-saga
          cp sudoku-brain-saga/logo.png dist/sudoku-brain-saga/logo.png
          cp sudoku-brain-saga/banner.png dist/sudoku-brain-saga/banner.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
